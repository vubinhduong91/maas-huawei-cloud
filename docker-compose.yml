name: maas-cache-lab

services:
  # One-shot: renders conf/apisix.yaml (with MAAS_API_KEY) into a docker volume.
  apisix-render:
    image: python:3.11-slim
    env_file: .env
    environment:
      LAB_MODE: ${LAB_MODE:-A}   # set by `make up MODE=...`
    volumes:
      - ./apisix:/src:ro
      - apisix-rendered:/out
    command: ["python", "/src/render.py", "--out", "/out/apisix.yaml"]
    restart: "no"

  # Mode A (production-like): client -> APISIX -> MaaS.
  # Mode B: client -> APISIX -> tap -> MaaS (upstream switched by render.py).
  # The APISIX container never receives MAAS_API_KEY as an env var.
  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.11.0-debian}
    depends_on:
      apisix-render:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp /rendered/apisix.yaml /usr/local/apisix/conf/apisix.yaml &&
        /usr/bin/apisix init &&
        exec /usr/local/openresty/bin/openresty -p /usr/local/apisix -g 'daemon off;'
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - apisix-rendered:/rendered:ro
      - ./logs/apisix:/usr/local/apisix/logs/lab
    ports:
      - "${LAB_BIND:-0.0.0.0}:9080:9080"   # LAB_BIND=127.0.0.1 on a public server (use ssh -L)
    restart: unless-stopped

  # Recording proxy (Phase 2), only started for modes B and C (profile "tap").
  #   :9090 mode B, reached by APISIX only;  :9091 mode C, client -> tap -> MaaS.
  # Holds MAAS_API_KEY (env) because mode C swaps the dev key for it.
  tap:
    build: ./tap
    profiles: ["tap"]
    env_file: .env
    environment:
      TAP_LOG_DIR: /logs
      # Key-order lab: this tap is "tap-post". It also writes logs/raw/post/<req_id>.*
      # for requests that came through tap-pre (X-Lab-Req-Id). TAP_POST_MODE=canon
      # simulates a gateway-side fix (keys sorted before MaaS).
      TAP_NAME: post
      TAP_RAW_DIR: /raw
      TAP_MODE: ${TAP_POST_MODE:-passthrough}
      TAP_SHUFFLE_TOOL_INDEX: ${TAP_POST_SHUFFLE_TOOL_INDEX:-0}
      TAP_SHUFFLE_SEED: ${TAP_POST_SHUFFLE_SEED:-}
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"   # log files owned by the host user
    volumes:
      - ./logs/tap:/logs
      - ./logs/raw:/raw
    ports:
      - "${LAB_BIND:-0.0.0.0}:9091:9091"
    restart: unless-stopped

  # Key-order lab (profile "keyorder", make keyorder-up): client -> tap-pre :9001 ->
  # APISIX (TAP_PRE_UPSTREAM=maas: straight to MaaS, the control path). Writes only
  # logs/raw/pre/<req_id>.*, never logs/tap, so analyze.py counts each request once.
  tap-pre:
    build: ./tap
    profiles: ["keyorder"]
    env_file: .env
    environment:
      TAP_NAME: pre
      TAP_RAW_DIR: /raw
      TAP_UPSTREAM: ${TAP_PRE_UPSTREAM:-http://apisix:9080}
      TAP_MODE: ${TAP_PRE_MODE:-passthrough}
      TAP_SHUFFLE_TOOL_INDEX: ${TAP_PRE_SHUFFLE_TOOL_INDEX:-0}
      TAP_SHUFFLE_SEED: ${TAP_PRE_SHUFFLE_SEED:-}
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    volumes:
      - ./logs/raw:/raw
    ports:
      - "${LAB_BIND:-0.0.0.0}:9001:9001"
    restart: unless-stopped

  # ---- View-only dashboard (make dashboard), profile "dashboard" --------------------
  # A second APISIX (>= 3.13, embedded UI) backed by etcd, loaded with the lab config
  # with keys masked. Not in the request path; it never sees MAAS_API_KEY.
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    profiles: ["dashboard"]
    command:
      - etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    restart: unless-stopped

  apisix-dashboard:
    image: apache/apisix:3.14.1-debian
    profiles: ["dashboard"]
    depends_on: [etcd]
    environment:
      DASHBOARD_ADMIN_KEY: ${DASHBOARD_ADMIN_KEY:-}
    volumes:
      - ./dashboard/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "${LAB_BIND:-0.0.0.0}:9180:9180"   # Admin API + UI at http://localhost:9180/ui/
    restart: unless-stopped

  dashboard-loader:
    image: python:3.11-slim
    profiles: ["dashboard"]
    depends_on: [apisix-dashboard]
    env_file: .env
    environment:
      LAB_MODE: ${LAB_MODE:-A}
    volumes:
      - ./apisix:/src:ro
      - ./dashboard:/dash:ro
    command: ["sh", "-c", "pip install -q --root-user-action=ignore pyyaml==6.0.2 && python /dash/load.py"]
    restart: "no"

volumes:
  apisix-rendered:
